info:
  contact: {}
  description: Public API documentation served through QRUPI API Gateway.
  title: QRUPI V2 API
  version: "2.0"
paths:
  /activities:
    get:
      parameters:
      - description: Sort by field
        in: query
        name: sortBy
        type: string
      - description: Sort order
        enum:
        - asc
        - desc
        in: query
        name: sortOrder
        type: string
      - description: Number of results per page
        in: query
        name: limit
        type: integer
      - description: Page number
        in: query
        name: page
        type: integer
      responses: {}
      security:
      - BearerAuth: []
      summary: Get all Activities
      tags:
